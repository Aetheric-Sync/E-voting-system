services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: evote
      POSTGRES_PASSWORD: evote_dev_only
      POSTGRES_DB: evote
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evote"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      AUTH_DEV: "true"   # local only; the guard refuses to start with NODE_ENV=production
      DATABASE_URL: postgresql://evote:evote_dev_only@postgres:5432/evote
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
